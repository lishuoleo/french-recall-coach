[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "french-recall-coach"
version = "0.1.0"
description = "A runnable Codex harness for French recall practice and agent engineering workshops"
requires-python = ">=3.10"
dependencies = ["fsrs==6.3.2", "typing_extensions==4.15.0"]

[tool.setuptools]
packages = ["coach"]
